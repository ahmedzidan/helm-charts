{{/*
secret.yaml — stores sensitive configuration (database credentials).

A Secret is base64-encoded in etcd (Kubernetes' key-value store).
It's NOT encrypted by default, but it IS:
  • Never printed in kubectl describe Pod output
  • Accessible only to pods in the same namespace
  • Overridable at deploy time via --set database.url="..." (CI never touches this file)

In production you would use:
  • GCP Secret Manager + External Secrets Operator
  • OR Vault + the Vault Agent injector
...to avoid storing the raw connection string in this file at all.

IMPORTANT: Never commit real credentials to git.
The database is managed externally (e.g. Cloud SQL) — not deployed by this chart.
Override the URL at deploy time: --set database.url="postgresql://user:pass@host/db"
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "checkout-api.labels" . | nindent 4 }}
type: Opaque
# stringData: Helm/k8s automatically base64-encodes these values
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
