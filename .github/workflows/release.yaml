# ─────────────────────────────────────────────────────────────────────────────
# Helm Chart Releaser
# ─────────────────────────────────────────────────────────────────────────────
# This workflow runs on every push to main and:
#   1. Packages any charts that have a new version in Chart.yaml
#   2. Publishes the packaged .tgz to the GitHub Release
#   3. Updates the Helm repo index on the gh-pages branch
#
# After setup, students add the repo once:
#   helm repo add xsolla-school https://<org>.github.io/helm-charts
#   helm repo update
#
# Then install/upgrade with:
#   helm upgrade --install checkout-api xsolla-school/checkout-api --version 0.1.0
# ─────────────────────────────────────────────────────────────────────────────

name: Release Helm Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # chart-releaser needs full history to detect changes

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # chart-releaser-action detects which charts changed (by Chart.yaml version bump),
      # packages them, creates a GitHub Release, and updates the gh-pages index.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts   # look for charts inside the charts/ directory
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
